<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>ASHFALL: Lakehead</title>
  <style>
    :root { --bg:#07090c; --ice:#e8eef4; --ink:#0a0d12; --muted:#8a9aaa; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--ice);
      width: 100%; height: 100%; overflow: hidden;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
      font-family: "ui-monospace", "Cascadia Code", "DejaVu Sans Mono", monospace;
    }
    #frame {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      aspect-ratio: 9 / 16;
      height: min(100dvh, calc(100dvw * 16 / 9));
      width: auto;
      max-width: 100dvw;
      max-height: 100dvh;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2a3340, 0 0 40px #000;
    }
    #view, #hud, #ui {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    #view, #hud {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #hud, #ui { pointer-events: none; }
    #ui > * { pointer-events: auto; }
    #ui { z-index: 20; }
    #hud { z-index: 4; }
    #view { z-index: 1; }
    #fade {
      position:absolute; inset:0; background:#07090c; opacity:0;
      pointer-events:none; z-index:10; transition: opacity 0.35s ease;
    }

    .layer { position:absolute; inset:0; display:flex; flex-direction:column; }
    .top-safe { padding-top: max(8px, env(safe-area-inset-top)); }
    .bot-safe { padding-bottom: max(8px, env(safe-area-inset-bottom)); }

    /* Title / menus */
    .screen {
      position:absolute; inset:0;
      background: rgba(7,9,12,0.86);
      color: var(--ice);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px 14px max(18px, env(safe-area-inset-bottom));
      pointer-events: auto;
      z-index: 8;
    }
    .screen.show { display: flex; }
    .screen h1 { font-size: 22px; letter-spacing: 0.18em; margin: 0 0 6px; font-weight: 600; }
    .screen h1 span { display:block; font-size: 11px; letter-spacing: 0.28em; color: var(--muted); margin-top: 4px; }
    .screen p { font-size: 12px; line-height: 1.45; color: #c5d0da; margin: 0 0 10px; }
    .btn-row { display:flex; flex-direction:column; gap:8px; margin-top: 10px; }
    button.menu {
      appearance:none; background: transparent; color: var(--ice);
      border: 1px solid var(--ice); padding: 10px 12px;
      font: inherit; font-size: 13px; letter-spacing: 0.12em;
      text-align: left; cursor: pointer;
    }
    button.menu:active, button.menu:hover { background: var(--ice); color: var(--ink); }

    /* Touch controls */
    #touch {
      position:absolute; inset:0; z-index:6; pointer-events:none;
      display:none;
    }
    /* Never let the joystick / FIRE layer sit over the title or menus.
       pointer-events:none on #touch does not disable children with auto. */
    body.touch.playing:not(.menu-open) #touch { display:block; }
    .joy-base {
      pointer-events:auto;
      position:absolute;
      left: max(10px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 110px; height: 110px;
      border: 1px solid rgba(232,238,244,0.35);
      border-radius: 50%;
      background: rgba(10,13,18,0.25);
    }
    .joy-knob {
      position:absolute; left:50%; top:50%;
      width:46px; height:46px; margin:-23px 0 0 -23px;
      border-radius:50%;
      background: rgba(232,238,244,0.55);
    }
    .joy-base.sprint {
      border-color: rgba(232,238,244,0.9);
      box-shadow: 0 0 0 1px rgba(232,238,244,0.35), inset 0 0 18px rgba(232,238,244,0.16);
    }
    .tbtn {
      pointer-events:auto;
      position:absolute;
      width:54px; height:54px;
      border: 1px solid rgba(232,238,244,0.7);
      background: rgba(10,13,18,0.4);
      color: var(--ice);
      font: inherit; font-size: 9px; letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
    }
    .tbtn:active { background: rgba(232,238,244,0.85); color:#0a0d12; }
    #btn-fire { right: max(12px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width:72px; height:72px; font-size:11px; }
    #btn-reload { right: max(96px, calc(env(safe-area-inset-right) + 84px)); bottom: max(16px, env(safe-area-inset-bottom)); width:56px; height:56px; }
    #btn-aim { right: max(96px, calc(env(safe-area-inset-right) + 84px)); bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px)); width:56px; height:40px; }
    #btn-interact { right: max(12px, env(safe-area-inset-right)); bottom: max(100px, calc(env(safe-area-inset-bottom) + 84px)); width:72px; height:44px; }
    #btn-mode { right: max(12px, env(safe-area-inset-right)); bottom: max(178px, calc(env(safe-area-inset-bottom) + 156px)); width:56px; height:32px; font-size:10px; display:none; }
    /* Top-right: BAG + pause icon only. Leave the top-left vitals a wide berth. */
    #btn-inv {
      right: max(52px, calc(env(safe-area-inset-right) + 44px));
      top: max(8px, env(safe-area-inset-top));
      width: 48px; height: 32px; font-size: 10px;
    }
    #btn-pause {
      right: max(8px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
      left: auto; transform: none;
      width: 36px; height: 32px; padding: 0;
    }
    #btn-melee {
      right: max(12px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 72px; height: 72px; padding: 0;
      border-radius: 50%;
    }
    #btn-melee svg { width: 34px; height: 34px; margin: 0 auto; }
    #btn-melee .ico-melee { display: none; }
    #btn-melee.is-melee .ico-knife { display: none; }
    #btn-melee.is-melee .ico-melee { display: block; }
    body.wield-melee #btn-fire,
    body.wield-melee #btn-aim,
    body.wield-melee #btn-reload,
    body.wield-unarmed #btn-fire,
    body.wield-unarmed #btn-aim,
    body.wield-unarmed #btn-reload,
    body.wield-thrown #btn-aim,
    body.wield-thrown #btn-reload,
    body.wield-gun #btn-melee,
    body.wield-thrown #btn-melee { display: none !important; }
    body.wield-melee #btn-swap,
    body.wield-unarmed #btn-swap {
      right: max(96px, calc(env(safe-area-inset-right) + 84px));
      bottom: max(16px, env(safe-area-inset-bottom));
    }
    #btn-swap {
      right: max(160px, calc(env(safe-area-inset-right) + 148px));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 48px; height: 48px; padding: 0;
    }
    #btn-craft { display: none !important; }
    .tbtn svg { display:block; width:18px; height:18px; margin: 0 auto; fill: currentColor; }
    #btn-pause svg { width:16px; height:16px; }
    #btn-swap svg { width:22px; height:22px; }
    #look-pad {
      pointer-events:auto;
      position:absolute;
      right:0; top: 20%;
      width: 58%; height: 48%;
    }

    /* Dialogue / inventory panels */
    #panel {
      display:none; position:absolute; z-index:9;
      left:0; right:0; bottom:0;
      background: rgba(10,13,18,0.92);
      border-top: 1px solid var(--ice);
      padding: 10px 12px max(14px, env(safe-area-inset-bottom));
      color: var(--ice);
      pointer-events:auto;
      max-height: 62%;
      overflow:auto;
    }
    #panel.show { display:block; }
    #panel .who { font-size: 10px; letter-spacing: 0.16em; color: var(--muted); margin-bottom: 4px; }
    #panel .line { font-size: 13px; line-height: 1.4; margin: 0 0 8px; }
    #panel .choices { display:flex; flex-direction:column; gap:6px; }
    #panel button {
      appearance:none; background:transparent; color:var(--ice);
      border:1px solid #8a9aaa; padding:7px 8px; font:inherit; font-size:12px;
      text-align:left; cursor:pointer;
    }
    #panel button:hover, #panel button:active { background:var(--ice); color:var(--ink); }
    #panel h2 { font-size:12px; letter-spacing:0.16em; margin:0 0 8px; }
    .item-row { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12px; padding:7px 0; border-bottom:1px solid #1c2430; }
    .item-row button, .recipe button {
      appearance:none; background:transparent; color:var(--ice);
      border:1px solid #8a9aaa; padding:4px 8px; font:inherit; font-size:11px; letter-spacing:0.08em;
      cursor:pointer; flex: 0 0 auto;
    }
    .item-row button:hover, .recipe button:hover { background:var(--ice); color:var(--ink); }
    .item-row.reveal { animation: lootIn 0.22s ease-out both; }
    @keyframes lootIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
    .recipe { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; font-size:12px; padding:7px 0; border-bottom:1px solid #1c2430; }
    .recipe .meta { color:#8a9aaa; font-size:10px; margin-top:2px; letter-spacing:0.04em; }
    .recipe.cant { opacity:0.4; }
    .recipe.cant button { pointer-events:none; }
    .searching { font-size:13px; letter-spacing:0.14em; padding: 8px 0 14px; }
    /* #touch is a higher stacking context than #ui. When a menu or dialogue
       is open, raise #ui and disable EVERY touch child (pointer-events:none on
       a parent does not stop children with pointer-events:auto). */
    body.menu-open #ui, body.char-sheet-open #ui { z-index: 20; }
    body.menu-open #touch,
    body.menu-open #touch * { pointer-events: none !important; }
    body.menu-open #touch { opacity: 0; }
    body.char-sheet-open #hud { visibility: hidden; }
    button, #panel, #panel button, .screen, .screen button { touch-action: manipulation; }
    #look-pad, #joy, #view { touch-action: none; }

    .inv-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

    #panel.char-sheet {
      top: 0; bottom: 0; left: 0; right: 0;
      max-height: 100%;
      display: flex; flex-direction: column;
      padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      background: #0a0d12;
      overflow: hidden;
      border-top: none;
      z-index: 11;
    }
    #panel.char-sheet.show { display:flex; }
    .char-top { flex: 1 1 48%; display:flex; min-height: 0; gap: 8px; }
    .char-doll { flex: 0 0 46%; display:flex; align-items:center; justify-content:center; background:#0c1016; border:1px solid #2a3340; }
    .char-doll canvas { image-rendering: pixelated; image-rendering: crisp-edges; height: 100%; width: auto; max-width: 100%; }
    .char-slots { flex: 1; overflow: auto; display:flex; flex-direction:column; gap: 3px; }
    .slot { display:flex; align-items:center; gap:6px; border:1px solid #3d4a59; padding:5px 6px; min-height: 28px; width:100%; font: inherit; font-size:10px; letter-spacing:0.06em; color:var(--ice); background:#121820; text-align:left; }
    .slot .slot-k { color:#8a9aaa; width: 4.2em; flex: 0 0 auto; }
    .slot .slot-v { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .slot .slot-d { color:#9ad4a8; font-size:9px; }
    .slot.drop, .slot:hover { background: rgba(232,238,244,0.1); border-color: var(--ice); }
    .slot[disabled] { opacity: 0.4; }
    .char-stats { font-size:10px; letter-spacing:0.06em; padding: 4px 0; color:#c5d0da; }
    .wbar { display:flex; align-items:center; gap:6px; }
    .wtrack { flex:1; height:6px; background:#1c2430; border:1px solid #3d4a59; }
    .wfill { height:100%; background:#8ec8e8; }
    .wfill.over { background:#d44; }
    .insul { margin-top:3px; color:#8a9aaa; }
    .char-bottom { flex: 1 1 42%; display:flex; flex-direction:column; min-height:0; }
    .satchel-label { font-size:11px; letter-spacing:0.16em; margin: 4px 0; }
    .satchel { display:grid; grid-template-columns: repeat(4, 1fr); gap:4px; flex:1; overflow:auto; align-content:start; }
    .cell { appearance:none; background:#121820; color:var(--ice); border:1px solid #293340; padding:6px 4px; font:inherit; font-size:9px; letter-spacing:0.04em; text-align:left; min-height:44px; position:relative; }
    .cell.on, .cell:hover { border-color:var(--ice); }
    .cell .cq { position:absolute; right:3px; bottom:2px; color:#8a9aaa; }
    .inv-ghost { position:absolute; z-index:12; pointer-events:none; background:#e8eef4; color:#0a0d12; font-size:10px; padding:4px 8px; border:1px solid #0a0d12; transform: translate(-20%, -120%); }
    .inv-picker { position:absolute; left:8%; right:8%; bottom:18%; background:#0c1016; border:1px solid var(--ice); padding:8px; z-index:11; display:flex; flex-direction:column; gap:4px; max-height:40%; overflow:auto; }
    .inv-picker[hidden], .inv-ghost[hidden] { display:none; }
    .inv-picker button { width:100%; }

    .sheet-tabs { display:flex; gap:6px; align-items:center; margin: 0 0 8px; flex: 0 0 auto; }
    .sheet-tabs button { flex: 1; text-align:center; letter-spacing:0.12em; font-size:11px !important; padding:8px 6px !important; }
    .sheet-tabs button.on { background: var(--ice); color: var(--ink); }
    .sheet-tabs .tab-close { flex: 0 0 auto; width: auto; padding: 8px 10px !important; }
    .craft-list { flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; min-height:0; }
    .craft-card { border:1px solid #2a3340; background:#121820; padding:8px; display:flex; flex-direction:column; gap:6px; }
    .craft-card.cant { opacity:0.72; }
    .craft-head { display:flex; align-items:center; gap:8px; font-size:13px; }
    .craft-head .badge { font-size:8px; letter-spacing:0.12em; border:1px solid #8a9aaa; color:#8a9aaa; padding:2px 5px; }
    .craft-note { margin:0; color:#8a9aaa; font-size:11px; line-height:1.35; }
    .craft-ing { list-style:none; margin:0; padding:0; font-size:11px; }
    .craft-ing li { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
    .craft-ing .have { color:#9ad4a8; }
    .craft-ing .need { color:#d48a8a; }
    .craft-station { font-size:10px; letter-spacing:0.08em; color:#d4a15a; }
    .craft-station.ok { color:#9ad4a8; }
    .craft-card button { text-align:center; letter-spacing:0.12em; }
    .craft-card button[disabled] { opacity:0.35; pointer-events:none; }
    .craft-confirm { margin-top:8px; padding:6px 8px; border:1px solid #9ad4a8; color:#9ad4a8; font-size:11px; letter-spacing:0.08em; }

    #loader {
      display: none; position: absolute; inset: 0; z-index: 40;
      background: rgba(7,9,12,0.92); color: var(--ice);
      flex-direction: column; justify-content: flex-end;
      padding: 18px 16px max(24px, env(safe-area-inset-bottom));
      pointer-events: auto;
    }
    #loader.show { display: flex; }
    #loader .load-title { font-size: 13px; letter-spacing: 0.18em; margin-bottom: 8px; }
    #loader .load-bar { height: 8px; background: #1c2430; border: 1px solid var(--ice); }
    #loader .load-fill { height: 100%; width: 0%; background: var(--ice); transition: width 0.2s ease; }
    #loader .load-pct { font-size: 11px; letter-spacing: 0.12em; margin-top: 6px; color: var(--muted); }
    #boot-error {
      display: none; position: absolute; inset: 0; z-index: 41;
      background: rgba(7,9,12,0.96); color: var(--ice);
      padding: 24px 16px; overflow: auto; pointer-events: auto;
    }
    #boot-error.show { display: block; }
    #boot-error h2 { letter-spacing: 0.16em; font-size: 14px; margin: 0 0 10px; }
    #boot-error pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 11px; color: #c5d0da;
      max-width: 100%;
      margin: 0 0 12px;
    }
    #boot-error-dismiss {
      appearance: none; display: none;
      background: transparent; color: var(--ice);
      border: 1px solid var(--ice); padding: 8px 12px;
      font: inherit; font-size: 11px; letter-spacing: 0.12em;
    }
    #boot-error.runtime #boot-error-dismiss { display: inline-block; }
    .dlg-bar { display:flex; justify-content:flex-end; margin: 0 0 8px; }
    .dlg-bar button { letter-spacing: 0.12em; font-size: 11px !important; padding: 6px 10px !important; }

    #build-tag {
      position: absolute;
      top: max(44px, calc(env(safe-area-inset-top) + 36px));
      right: 8px;
      z-index: 30;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--muted);
      pointer-events: none;
    }
    #save-notice {
      display: none;
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid var(--ice);
      background: rgba(20, 16, 10, 0.85);
      color: var(--ice);
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.04em;
    }
    #save-notice.show { display: block; }
    #boot-banner {
      display: none;
      position: absolute;
      left: 8px; right: 8px;
      top: max(28px, calc(env(safe-area-inset-top) + 22px));
      z-index: 42;
      background: #140c0c;
      border: 1px solid var(--ice);
      color: var(--ice);
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      letter-spacing: 0.03em;
      pointer-events: auto;
    }
    #boot-banner.show { display: block; }
    #boot-banner button {
      appearance: none;
      margin-top: 8px;
      background: transparent;
      color: var(--ice);
      border: 1px solid var(--ice);
      padding: 8px 10px;
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.1em;
    }

  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="frame">
    <div id="build-tag">r6</div>
    <canvas id="view" width="180" height="320"></canvas>
    <canvas id="hud" width="360" height="640"></canvas>
    <div id="ui">
      <div id="title" class="screen show top-safe">
        <h1>ASHFALL<span>LAKEHEAD  ·  SECTOR 4</span></h1>
        <p>October. The grid is dead. The lake is freezing. Your son’s insulin will not last the month.</p>
        <div id="save-notice" hidden></div>
        <div class="btn-row">
          <button class="menu" id="btn-new" type="button">NEW SHIFT</button>
          <button class="menu" id="btn-continue" type="button" style="display:none">CONTINUE</button>
          <button class="menu" id="btn-notes-title" type="button">FIELD NOTES</button>
        </div>
      </div>
      <div id="dead" class="screen">
        <h1>COLD<span>YOU DID NOT GET UP</span></h1>
        <p id="dead-reason">Hypothermia, Sector 4.</p>
        <div class="btn-row">
          <button class="menu" id="btn-restart">BEGIN AGAIN</button>
          <button class="menu" id="btn-menu">TITLE</button>
        </div>
      </div>
      <div id="ending" class="screen">
        <h1 id="ending-title">THE WARM ROOM</h1>
        <p id="ending-body"></p>
        <div class="btn-row">
          <button class="menu" id="btn-ending-menu">TITLE</button>
        </div>
      </div>
      <div id="pause" class="screen">
        <h1>PAUSED<span>WIND STILL MOVING</span></h1>
        <div class="btn-row">
          <button class="menu" id="btn-resume">RESUME</button>
          <button class="menu" id="btn-unstuck">UNSTUCK</button>
          <button class="menu" id="btn-look">LOOK: REFINED</button>
          <button class="menu" id="btn-crt">CRT: LOW</button>
          <button class="menu" id="btn-save">SAVE</button>
          <button class="menu" id="btn-notes">FIELD NOTES</button>
          <button class="menu" id="btn-quit">TITLE</button>
        </div>
      </div>
      <div id="panel"></div>
    </div>
    <div id="fade"></div>
    <div id="loader" aria-live="polite">
      <div class="load-title">LOADING</div>
      <div class="load-bar"><div class="load-fill" id="load-fill"></div></div>
      <div class="load-pct" id="load-pct">Loading 0%…</div>
    </div>
    <div id="boot-error"><h2 id="boot-error-title">ASHFALL FAILED TO LOAD</h2><pre id="boot-error-pre"></pre><button type="button" id="boot-error-dismiss" hidden>DISMISS</button></div>
    <div id="boot-banner" role="alert"></div>
    <div id="touch">
      <div id="look-pad"></div>
      <div class="joy-base" id="joy"><div class="joy-knob" id="joy-knob"></div></div>
      <button class="tbtn" id="btn-fire">FIRE</button>

  <script>
    window.__ASHFALL_BUILD = "r6";
    window.__ASHFALL_BOOTED = false;
    window.__ASHFALL_MODULE = false;
    window.__ASHFALL_PENDING = null;
    (function () {
      function $(id) { return document.getElementById(id); }
      function showBanner(msg) {
        var el = $("boot-banner");
        if (!el) return;
        el.textContent = "";
        var p = document.createElement("div");
        p.textContent = msg;
        el.appendChild(p);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "RELOAD";
        btn.addEventListener("click", function () { location.reload(); });
        el.appendChild(btn);
        el.classList.add("show");
      }
      function showErr(msg) {
        var el = $("boot-error");
        var pre = $("boot-error-pre");
        var title = $("boot-error-title");
        var dismiss = $("boot-error-dismiss");
        var runtime = !!window.__ASHFALL_BOOTED;
        if (title) title.textContent = runtime ? "RUNTIME ERROR" : "ASHFALL FAILED TO LOAD";
        if (pre && !pre.textContent) pre.textContent = msg;
        if (el) { el.classList.toggle("runtime", runtime); el.classList.add("show"); }
        if (dismiss) {
          dismiss.hidden = !runtime;
          dismiss.onclick = function () { if (el) el.classList.remove("show"); };
        }
        window.__ERROR = msg;
      }
      function showLoad(label) {
        var el = $("loader");
        if (!el) return;
        el.classList.add("show");
        var text = $("load-pct");
        if (text) text.textContent = (label || "Loading") + " 8%…";
        var fill = $("load-fill");
        if (fill && !fill.style.width) fill.style.width = "8%";
      }
      window.__ashfallBootFail = function (msg) {
        showBanner(msg);
        showErr(msg);
      };
      window.addEventListener("error", function (e) {
        var msg = (e && (e.message || (e.error && (e.error.stack || e.error.message)))) || "Script error";
        if (e && e.filename) msg += " (" + e.filename + (e.lineno ? ":" + e.lineno : "") + ")";
        window.__ERROR = msg;
        if (!window.__ASHFALL_BOOTED) showBanner("A script error stopped the game from starting: " + msg);
        showErr(msg);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        var msg = String((r && (r.stack || r.message)) || r || "Unhandled promise rejection");
        window.__ERROR = msg;
        if (!window.__ASHFALL_BOOTED) showBanner("A background error stopped the game from starting: " + msg);
        showErr(msg);
      });
      function queueTitle(id) {
        if (window.__ASHFALL_BOOTED) return;
        window.__ASHFALL_PENDING = id;
        showLoad(id === "btn-notes-title" ? "Opening notes" : "Loading");
      }
      document.addEventListener("pointerup", function (e) {
        var t = e.target;
        if (!t || !t.id) return;
        if (t.id !== "btn-new" && t.id !== "btn-continue" && t.id !== "btn-notes-title") return;
        if (window.__ASHFALL_BOOTED) return;
        try { e.preventDefault(); e.stopPropagation(); } catch (err) {}
        queueTitle(t.id);
      }, true);
      document.addEventListener("click", function (e) {
        var t = e.target;
        if (!t || !t.id) return;
        if (t.id !== "btn-new" && t.id !== "btn-continue" && t.id !== "btn-notes-title") return;
        if (window.__ASHFALL_BOOTED) return;
        try { e.preventDefault(); e.stopPropagation(); } catch (err) {}
        queueTitle(t.id);
      }, true);
      setTimeout(function () {
        if (window.__ASHFALL_BOOTED) return;
        if (window.__ASHFALL_MODULE) {
          showBanner("The game file loaded, but startup is stuck (often a Safari WebGL or cache issue). Wait a moment, or clear this site's data and reload. Build r6.");
        } else {
          showBanner("The game never started — the script did not load. If you opened this from an older Home Screen icon, delete it and reopen the page, or clear Safari cache for this site. Build r6.");
        }
      }, 4000);
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=r6", { scope: "./" }).then(function (reg) {
          try { reg.update(); } catch (err) {}
        }).catch(function () {});
      }
    })();
  </script>
  <script type="module" src="./js/game.js" onerror="window.__ASHFALL_MODULE_ERR=true; if (window.__ashfallBootFail) window.__ashfallBootFail('The game script failed to load. Try a hard refresh or clear this site\\'s data. Build r6.');"></script>
